<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Troubleshooting</title>
    <link rel="stylesheet" href="troubleshooting.css">
    <script src="troubleshooting.js"></script>
</head>
<body>
    <header>
        <div class="button" onclick="mainMenu()">
            <span class="en">Back</span>
            <span class="zh">返回</span>
        </div>
    </header>
    <main>
        <div id="content">

        </div>
        <div id="content-buttons">
            <div id="prev" class="button" onclick="restart()">
                <span class="en">Return to start</span>
                <span class="zh">回到首页</span>
            </div>
        </div>
        <div id="list-buttons">
            <div id="prev" class="button" onclick="prev()">
                &lt;
                <span class="en">Prev</span>
                <span class="zh">前</span>
            </div>
            <div id="next" class="button" onclick="next()">
                &gt;
                <span class="en">Next</span>
                <span class="zh">后</span>
            </div>
        </div>
        <div id="option-buttons">
            
        </div>
    </main>
</body>
</html>
